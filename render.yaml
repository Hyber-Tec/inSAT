# Render Blueprint - insat: API (Node) + client (static site).
# Generation runs in-app; Postgres is Neon. The whole stack comes up from this
# one Blueprint — no Cloudflare needed. See DEPLOY.md for the full walkthrough.
#
# After the first deploy, set the `sync: false` values in the Render dashboard.
# Two of them are circular (each service needs the other's URL), so fill them
# once both services exist:
#   API  · DATABASE_URL      — your Neon connection string (must include ?sslmode=require)
#   API  · ANTHROPIC_API_KEY — platform fallback key (or leave unset to require per-institution keys)
#   API  · SUPERADMIN_* / ADMIN_* — change these from the defaults
#   API  · CLIENT_ORIGIN     — the client static-site URL (e.g. https://satify-client.onrender.com)
#   CLIENT · VITE_API_URL    — the API URL (e.g. https://satify-api.onrender.com)

services:
  - type: web
    name: satify-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Platform fallback key for generation/extraction (runs in-app). Leave unset
      # to require each institution to bring their own key.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REQUIRE_INSTITUTION_KEY
        value: "true"
      # Optional: email invite links via Resend. Leave unset to show links in the
      # admin UI for manual sharing instead of emailing them.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_NAME
        value: insat Superadmin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # Client — static React/Vite build, served from Render's CDN (always-on, free).
  - type: web
    name: satify-client
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    # SPA: serve index.html for any path so client-side routing works.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The API's public URL, baked into the bundle at build time. Set this in the
      # dashboard after the API service exists (e.g. https://satify-api.onrender.com).
      - key: VITE_API_URL
        sync: false
